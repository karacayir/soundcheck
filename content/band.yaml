# The band, and the roles that make up the lineup grid.
#
# `slots` is how many columns a role gets on the printable setlist — vocals had
# three columns on last year's sheet, guitar had two.
# `view` decides which reading mode a member lands on by default.

slug: funky-monkey
name: Funky Monkey
tagline: Live performance companion

