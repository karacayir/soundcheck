    label: "Intro (band)"
    chords: "| Cm Ab | Bb Cm | Ab Bb | Eb Cm |"
    cue: "Band in"
    repeat: 2
  - id: intro-out
    label: "Into the riff"
    chords: "| Ab Bb | N.C. | % |"
  - id: riff
    label: "A — Riff"
    chords: "| Cm | % |"
    repeat: 6
  - id: riff-turn
    label: "A — Riff turnaround"
    chords: "| F | % | Cm | % | Bb | % | F | G |"
  - id: verse
    label: "Verse"
    chords: "| Cm Ab | Bb Cm | Ab Bb | Eb Cm |"
    repeat: 2
  - id: verse-out
    label: "Verse out"
    chords: "| Ab Bb | N.C. | % |"
    cue: "D.S. al Coda"
  - id: solo
    label: "Solo"
    chords: "| Cm Ab | Bb Cm |"
    repeat: 3
  - id: solo-out
    label: "Solo out"
    chords: "| Cm Ab | G | % |"
  - id: breakdown
    label: "Breakdown"
    chords: "| N.C. | % | % |"
    cue: "Vocals and drums only"
  - id: verse-last
    label: "Verse (last)"
    chords: "| Cm Ab | Bb Cm | Ab Bb | Eb Cm |"
  - id: outro
    label: "Outro"
    chords: "| Ab Bb | Eb Cm |"
    cue: "Fade out"
    repeat: 4

cues:
  - { at: intro, text: "Opens on vocals alone — band waits, no click" }
  - { at: breakdown, text: "Vocals and drums only, then straight back in" }

