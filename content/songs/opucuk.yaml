id: opucuk
title: "Öpücük"
artist: "Athena"
key: C#m
tempo: 96
meter: "4/4"
style: rock
duration: "3:31"

notes: |
  Ska-punk feel — guitar on the offbeats.

  Draft chart from published chord sheets — the shape is right, but check
  the bar counts against the record before the show. Sheets disagree on whether to call this
  C#m or F#m; it is written here as C#m, so the verse reads iv - i - V.

structure:
  - id: intro
    label: "Intro"
    chords: "| F#m | C#m | G# | % |"
  - id: verse
    label: "Verse"
    chords: "| F#m | C#m | G# | % |"
    repeat: 2
  - id: pre
    label: "Pre-chorus"
    chords: "| F#m | C#m | D# | G# |"
  - id: chorus
    label: "Chorus"
    chords: "| F#m | C#m | A | F#m G# |"
    repeat: 2
  - id: outro
    label: "Outro"
    chords: "| F#m | C#m | G# | % |"

