id: hysteria
title: "Hysteria"
artist: "Muse"
key: Am
tempo: 84
meter: "4/4"
style: rock
duration: "3:47"

notes: |
  Draft chart from published chord sheets — the shape is right, but check
  the bar counts against the record before the show.

  Written at 84 so the click sits on the backbeat — the bass riff is straight
  16ths on top of that. If it feels sluggish on stage, count it at 168.

structure:
  - id: intro
    label: "Intro"
    chords: "| Am | % | % | % |"
    cue: "Bass riff alone — 16ths"
    repeat: 2
  - id: verse
    label: "Verse"
    chords: "| Am | % | Em | % |"
    repeat: 2
  - id: chorus
    label: "Chorus"
    chords: "| Dm | Am | C | G |"
    repeat: 2
  - id: solo
    label: "Solo"
    chords: "| Am | % | % | % |"
    cue: "Guitar solo over the riff"
    repeat: 2
  - id: outro
    label: "Outro"
    chords: "| Am | % | % | % |"
    cue: "Riff out, full stop"

cues:
  - { at: intro, text: "Bass starts alone — band in on the downbeat of the verse" }

